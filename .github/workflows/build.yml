name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "QuickReply"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.nabil.quickreply"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.nabil.quickreply"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0"
              }
              signingConfigs {
                  create("fixed") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("fixed")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="رد سريع"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BubbleService"
                      android:exported="true"
                      android:label="رد سريع"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/nabil/quickreply
          cat > app/src/main/java/com/nabil/quickreply/BubbleService.kt <<'EOF_FILE'
          package com.nabil.quickreply

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class BubbleService : AccessibilityService() {

              private enum class State { IDLE, WAIT_BUTTON, VERIFY }

              private val message = "مرحبا معك نبيل، كيف يمكنني مساعدتك؟"
              private val discord = "com.discord"

              private val handler = Handler(Looper.getMainLooper())
              private lateinit var wm: WindowManager
              private var bubble: View? = null

              private var state = State.IDLE
              private var startTime = 0L
              private var attempts = 0
              private var lastStructural = 0L
              private var lastVia = ""
              private var needSnapshot = true
              private var snapshot: Set<String> = emptySet()
              private var lastInput: AccessibilityNodeInfo? = null

              // A label containing one of these is a candidate for the real send button.
              private val sendKeys = listOf("send", "إرسال", "ارسال")
              // Look-alike buttons that must never be pressed (e.g. "Send a gift").
              private val blocked = listOf(
                  "gift", "هدية", "هديه", "nitro", "voice", "صوت", "file", "ملف", "image", "صورة",
                  "emoji", "إيموجي", "ايموجي", "sticker", "ملصق", "gif", "attach", "upload"
              )

              // ---------------------------------------------------------------- loops

              private val poll = object : Runnable {
                  override fun run() {
                      if (state != State.WAIT_BUTTON) return
                      if (tryClickSend(true)) return
                      if (SystemClock.uptimeMillis() - startTime > 2000) {
                          giveUp()
                          return
                      }
                      handler.postDelayed(this, 3)
                  }
              }

              // After tapping, make sure the text really left the box; if not, tap again.
              private val verify = Runnable {
                  val input = lastInput
                  val stillThere = input != null && input.refresh() &&
                      (input.text?.toString() ?: "").contains(message.take(15))
                  if (!stillThere) {
                      log("تم الإرسال ✓ (محاولة $attempts، $lastVia)")
                      state = State.IDLE
                  } else if (attempts < 3) {
                      startTime = SystemClock.uptimeMillis()
                      state = State.WAIT_BUTTON
                      handler.post(poll)
                  } else {
                      log("فشل: النص بقي في الخانة بعد $attempts محاولات ($lastVia)")
                      state = State.IDLE
                  }
              }

              // Show the bubble only while Discord is the active app.
              private val updateVisibility = Runnable {
                  val pkg = rootInActiveWindow?.packageName?.toString() ?: return@Runnable
                  if (pkg == "com.android.systemui") return@Runnable
                  bubble?.visibility = if (pkg == discord) View.VISIBLE else View.GONE
              }

              // ------------------------------------------------------------ lifecycle

              override fun onServiceConnected() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  addBubble()
                  handler.postDelayed(updateVisibility, 300)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  if (state == State.WAIT_BUTTON) {
                      tryClickSend(false) // click the send button the instant it appears
                      return
                  }
                  if (state != State.IDLE) return
                  val pkg = event.packageName?.toString()
                  if (pkg == discord) {
                      if (bubble?.visibility != View.VISIBLE) bubble?.visibility = View.VISIBLE
                  } else if (event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      handler.removeCallbacks(updateVisibility)
                      handler.postDelayed(updateVisibility, 150)
                  }
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  bubble?.let { runCatching { wm.removeView(it) } }
                  bubble = null
                  handler.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }

              // --------------------------------------------------------------- bubble

              private fun addBubble() {
                  val d = resources.displayMetrics.density
                  val size = (58 * d).toInt()
                  val screenW = resources.displayMetrics.widthPixels
                  val screenH = resources.displayMetrics.heightPixels

                  val view = View(this).apply {
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#5865F2"))
                      }
                  }
                  val lp = WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = (16 * d).toInt()
                      y = (300 * d).toInt()
                  }

                  val slop = ViewConfiguration.get(this).scaledTouchSlop
                  var startX = 0; var startY = 0
                  var touchX = 0f; var touchY = 0f
                  var moved = false

                  view.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = lp.x; startY = lp.y
                              touchX = e.rawX; touchY = e.rawY
                              moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - touchX).toInt()
                              val dy = (e.rawY - touchY).toInt()
                              if (Math.abs(dx) > slop || Math.abs(dy) > slop) moved = true
                              if (moved) {
                                  lp.x = (startX + dx).coerceIn(0, screenW - size)
                                  lp.y = (startY + dy).coerceIn(0, screenH - size)
                                  wm.updateViewLayout(view, lp)
                              }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) sendReply()
                      }
                      true
                  }

                  wm.addView(view, lp)
                  bubble = view
              }

              // ----------------------------------------------------------------- send

              private fun sendReply() {
                  val now = SystemClock.uptimeMillis()
                  if (state != State.IDLE) {
                      if (now - startTime < 5000) return
                      state = State.IDLE
                  }
                  val root = rootInActiveWindow ?: return
                  if (root.packageName?.toString() != discord) return // Discord only

                  val input = findInput(root)
                  if (input == null) {
                      log("فشل: لم يتم العثور على خانة الكتابة")
                      return
                  }

                  startTime = now
                  attempts = 0
                  needSnapshot = true
                  snapshot = emptySet()

                  val args = Bundle().apply {
                      putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, message)
                  }
                  if (!input.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)) {
                      log("فشل: تعذر كتابة النص في الخانة")
                      return
                  }

                  lastInput = input
                  state = State.WAIT_BUTTON
                  handler.post(poll)
              }

              private fun tryClickSend(allowStructural: Boolean): Boolean {
                  if (state != State.WAIT_BUTTON) return false
                  val root = rootInActiveWindow ?: return false

                  val input = lastInput
                  val band = Rect()
                  val bandOk = input != null && input.refresh()
                  if (bandOk) input?.getBoundsInScreen(band)

                  // 1) By label (fastest).
                  var btn = findSendByLabel(root, if (bandOk) band else null)
                  var via = "label"

                  // 2) By position: a NEW clickable item that appeared to the right of the text box.
                  if (btn == null && allowStructural && bandOk && input != null) {
                      if (needSnapshot) {
                          snapshot = composerButtons(input, band).map { sig(it) }.toSet()
                          needSnapshot = false
                      } else {
                          val now = SystemClock.uptimeMillis()
                          if (now - lastStructural >= 30) {
                              lastStructural = now
                              btn = pickStructural(input, band, now - startTime)
                              via = "position"
                          }
                      }
                  }

                  if (btn == null) return false
                  issueClick(btn, via)
                  return true
              }

              private fun issueClick(btn: AccessibilityNodeInfo, via: String) {
                  state = State.VERIFY
                  attempts++
                  handler.removeCallbacks(poll)

                  val r = rectOf(btn)
                  var ok = false
                  // Attempt 2 uses a plain accessibility click; others use a real touch tap,
                  // which works with every kind of button (including React Native ones).
                  if (attempts != 2) ok = tap(r.exactCenterX(), r.exactCenterY(), btn)
                  if (!ok) clickNode(btn)

                  lastVia = "$via ${SystemClock.uptimeMillis() - startTime}ms"
                  handler.postDelayed(verify, 350)
              }

              private fun tap(x: Float, y: Float, fallback: AccessibilityNodeInfo): Boolean {
                  val path = Path().apply { moveTo(x, y) }
                  val stroke = GestureDescription.StrokeDescription(path, 0, 25)
                  val gesture = GestureDescription.Builder().addStroke(stroke).build()
                  return dispatchGesture(gesture, object : GestureResultCallback() {
                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          clickNode(fallback)
                      }
                  }, null)
              }

              private fun giveUp() {
                  state = State.IDLE
                  fallbackEnter()
                  val sb = StringBuilder()
                  val input = lastInput
                  if (input != null && input.refresh()) {
                      val band = rectOf(input)
                      for (n in composerButtons(input, band)) sb.append("[").append(sig(n)).append("] ")
                  }
                  log("فشل: لم يظهر زر الإرسال. عناصر قرب الخانة: $sb")
              }

              private fun fallbackEnter() {
                  val input = lastInput ?: return
                  if (Build.VERSION.SDK_INT >= 30) {
                      input.refresh()
                      input.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                  }
              }

              // ------------------------------------------------------- finding things

              private fun findInput(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)?.let { if (it.isEditable) return it }
                  return findEditableFromEnd(root)
              }

              // Walks from the bottom of the screen upward and stops at the first text box.
              private fun findEditableFromEnd(node: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  if (!node.isVisibleToUser) return null
                  if (node.isEditable) return node
                  for (i in node.childCount - 1 downTo 0) {
                      val child = node.getChild(i) ?: continue
                      val hit = findEditableFromEnd(child)
                      if (hit != null) return hit
                  }
                  return null
              }

              private fun findSendByLabel(root: AccessibilityNodeInfo, band: Rect?): AccessibilityNodeInfo? {
                  for (key in sendKeys) {
                      val list = root.findAccessibilityNodeInfosByText(key).orEmpty()
                      var best: AccessibilityNodeInfo? = null
                      for (n in list) {
                          val label = labelOf(n)
                          if (label.isEmpty() || isBlocked(label)) continue
                          if (!sendKeys.any { label.contains(it) }) continue
                          if (!n.isVisibleToUser) continue
                          if (band != null) {
                              val r = rectOf(n)
                              if (r.centerY() < band.top - band.height() || r.centerY() > band.bottom + band.height()) continue
                          }
                          best = n
                      }
                      if (best != null) return best
                  }
                  return null
              }

              private fun pickStructural(input: AccessibilityNodeInfo, band: Rect, elapsed: Long): AccessibilityNodeInfo? {
                  val usable = composerButtons(input, band).filter { !isBlocked(labelOf(it)) }
                  if (usable.isEmpty()) return null
                  val fresh = usable.filter { sig(it) !in snapshot }
                  val pool = when {
                      fresh.isNotEmpty() && snapshot.isNotEmpty() -> fresh
                      elapsed >= 350 -> usable
                      else -> emptyList()
                  }
                  return pool.maxByOrNull { rectOf(it).centerX() }
              }

              // Clickable items on the same row as the text box and to its right (emoji, send, ...).
              private fun composerButtons(input: AccessibilityNodeInfo, band: Rect): List<AccessibilityNodeInfo> {
                  var anc: AccessibilityNodeInfo? = input.parent
                  var level = 0
                  while (anc != null && level < 5) {
                      val found = ArrayList<AccessibilityNodeInfo>()
                      val budget = intArrayOf(80)
                      scan(anc, band, found, budget)
                      if (found.isNotEmpty()) return found
                      anc = anc.parent
                      level++
                  }
                  return emptyList()
              }

              private fun scan(node: AccessibilityNodeInfo, band: Rect, out: MutableList<AccessibilityNodeInfo>, budget: IntArray) {
                  if (budget[0] <= 0) return
                  budget[0]--
                  if (node.isClickable && node.isEnabled && node.isVisibleToUser && !node.isEditable) {
                      val r = rectOf(node)
                      val slack = band.height()
                      val maxW = resources.displayMetrics.widthPixels * 0.4
                      if (r.width() < maxW && r.centerX() > band.centerX() &&
                          r.centerY() >= band.top - slack && r.centerY() <= band.bottom + slack
                      ) out.add(node)
                  }
                  for (i in 0 until node.childCount) {
                      val c = node.getChild(i) ?: continue
                      scan(c, band, out, budget)
                      if (budget[0] <= 0) return
                  }
              }

              private fun clickNode(node: AccessibilityNodeInfo): Boolean {
                  var n: AccessibilityNodeInfo? = node
                  while (n != null) {
                      if (n.isClickable) return n.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      n = n.parent
                  }
                  return false
              }

              // -------------------------------------------------------------- helpers

              private fun rectOf(n: AccessibilityNodeInfo): Rect {
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  return r
              }

              private fun labelOf(n: AccessibilityNodeInfo): String =
                  (n.contentDescription ?: n.text ?: "").toString().lowercase().trim()

              private fun isBlocked(label: String): Boolean = blocked.any { label.contains(it) }

              private fun sig(n: AccessibilityNodeInfo): String {
                  val r = rectOf(n)
                  return "${r.left},${r.top},${r.right},${r.bottom}|${labelOf(n)}"
              }

              private fun log(text: String) {
                  val time = SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())
                  getSharedPreferences("qr", Context.MODE_PRIVATE)
                      .edit().putString("log", "$time  $text").apply()
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/nabil/quickreply
          cat > app/src/main/java/com/nabil/quickreply/MainActivity.kt <<'EOF_FILE'
          package com.nabil.quickreply

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var logView: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (24 * resources.displayMetrics.density).toInt()
                  val ink = Color.parseColor("#1A1A1A")

                  val title = TextView(this).apply {
                      text = "رد سريع"
                      textSize = 28f
                      setTextColor(ink)
                      gravity = Gravity.CENTER
                  }
                  val body = TextView(this).apply {
                      text = "فعّل الخدمة من إعدادات الوصول، ثم افتح ديسكورد وستظهر دائرة عائمة. اضغطها لإرسال الرد فورا."
                      textSize = 16f
                      setTextColor(ink)
                      gravity = Gravity.CENTER
                      setPadding(0, pad, 0, pad)
                  }
                  val btn = Button(this).apply {
                      text = "فتح إعدادات الوصول"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  }
                  val logTitle = TextView(this).apply {
                      text = "آخر محاولة إرسال"
                      textSize = 18f
                      setTextColor(ink)
                      gravity = Gravity.CENTER
                      setPadding(0, pad, 0, pad / 3)
                  }
                  logView = TextView(this).apply {
                      textSize = 14f
                      setTextColor(ink)
                      gravity = Gravity.CENTER
                      setTextIsSelectable(true)
                  }

                  val column = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(pad, pad * 2, pad, pad)
                      addView(title); addView(body); addView(btn); addView(logTitle); addView(logView)
                  }
                  setContentView(ScrollView(this).apply {
                      setBackgroundColor(Color.WHITE)
                      addView(column)
                  })
              }

              override fun onResume() {
                  super.onResume()
                  logView.text = getSharedPreferences("qr", MODE_PRIVATE)
                      .getString("log", "لا توجد محاولات بعد")
              }
          }
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources>
              <string name="service_desc">يعرض دائرة عائمة، وعند الضغط عليها يكتب الرد ويرسله تلقائيا في التطبيق المفتوح.</string>
          </resources>
          EOF_FILE
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewTextChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="@string/service_desc"
              android:notificationTimeout="0" />
          EOF_FILE
          echo '' | base64 -d > app/debug.keystore
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "QuickReply v${{ github.run_number }}" --notes "Download app-debug.apk"
