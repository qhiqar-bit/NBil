name: Build APK
on:
  push:
    paths-ignore:
      - 'data.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AlFidaCity"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.alfida.city"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.alfida.city"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = ${{ github.run_number }}
                  versionName = "1.${{ github.run_number }}"
              }
              signingConfigs {
                  create("fixed") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("fixed")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/alfida/city app/src/main/assets app/src/main/res/mipmap-xxhdpi
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="الفداء سيتي"
                  android:icon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          cat > app/src/main/java/com/alfida/city/MainActivity.kt <<'EOF_FILE'
          package com.alfida.city

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.provider.MediaStore
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {

              private lateinit var web: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val navy = Color.parseColor("#04152a")
                  window.statusBarColor = navy
                  window.navigationBarColor = navy
                  web = WebView(this)
                  web.setBackgroundColor(navy)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.addJavascriptInterface(Bridge(), "Android")
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest): Boolean {
                          if (r.url.scheme == "file") return false
                          startActivity(Intent(Intent.ACTION_VIEW, r.url))
                          return true
                      }
                  }
                  web.loadUrl("file:///android_asset/index.html")
                  setContentView(web)
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun share(text: String) {
                      runOnUiThread {
                          val i = Intent(Intent.ACTION_SEND).apply {
                              type = "text/plain"
                              putExtra(Intent.EXTRA_TEXT, text)
                          }
                          startActivity(Intent.createChooser(i, null))
                      }
                  }

                  @JavascriptInterface
                  fun saveImage(b64: String, name: String) {
                      val v = ContentValues().apply {
                          put(MediaStore.Images.Media.DISPLAY_NAME, name)
                          put(MediaStore.Images.Media.MIME_TYPE, "image/png")
                          put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/AlFida")
                      }
                      val u = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v) ?: return
                      contentResolver.openOutputStream(u)?.use { it.write(Base64.decode(b64, Base64.DEFAULT)) }
                  }
              }
          }
          EOF_FILE
          python3 - <<'PY'
          import re, json
          h = open('index.html', encoding='utf-8').read()
          d = json.dumps(json.load(open('data.json', encoding='utf-8')), ensure_ascii=False).replace('<', '\\u003c')
          h = re.sub(r'(<script id="D" type="application/json">).*?(</script>)', lambda m: m.group(1) + d + m.group(2), h, count=1, flags=re.S)
          h = h.replace('__REPO__', '${{ github.repository }}').replace('__BRANCH__', '${{ github.event.repository.default_branch }}')
          open('app/src/main/assets/index.html', 'w', encoding='utf-8').write(h)
          PY
          echo '' | base64 -d > app/src/main/res/mipmap-xxhdpi/ic_launcher.webp
          echo '' | base64 -d > app/debug.keystore
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "Al-Fida City v${{ github.run_number }}" --notes "Download app-debug.apk"
