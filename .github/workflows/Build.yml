name: Build APK
on:
  push:
    paths-ignore:
      - 'data.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Seed data.json
        run: |
          [ -f data.json ] && exit 0
          cat > data.json <<'EOF_FILE'
          {
           "sub": "فخر الناصرية والعراق — نادٍ وُلد من أرض أور ليحمل حلم مدينة بأكملها.",
           "ig": "fidaasc",
           "match": {},
           "news": [],
           "honours": [
            {
             "t": "بطل دوري أبطال الناصرية",
             "y": "2023"
            }
           ],
           "cards": [
            {
             "e": "🏛️",
             "t": "الأرض",
             "b": "في الناصرية، حيث تقف زقورة أور شاهدة على آلاف السنين، يبدأ الحلم على أرض صنعت أولى الحضارات."
            },
            {
             "e": "🦅",
             "t": "الشعار",
             "b": "نسر مجنّح يحرس الزقورة، وكرة تحمل حلم مدينة: القوة والتاريخ وشغف كرة القدم."
            },
            {
             "e": "🇮🇶",
             "t": "الروح",
             "b": "ONE IRAQ — عراق واحد وروح واحدة، فخر الناصرية وكل العراق."
            }
           ],
           "tl": [
            {
             "y": "2023",
             "t": "ولادة نادي الفداء سيتي",
             "b": "انطلاقة النادي من مدينة الناصرية."
            },
            {
             "y": "🏆",
             "t": "بطل دوري أبطال الناصرية",
             "b": "أول لقب في تاريخ النادي."
            },
            {
             "y": "NEXT",
             "t": "الرحلة مستمرة",
             "b": "نحو ألقاب جديدة ومجد أكبر."
            }
           ],
           "players": [
            {
             "n": 1,
             "t": "نبيل كاسياس",
             "c": false
            },
            {
             "n": 3,
             "t": "موبي مالديني",
             "c": false
            },
            {
             "n": 5,
