            {
             "n": 8,
             "t": "حسين كارلوس",
             "c": false
            },
            {
             "n": 9,
             "t": "كرار نازاريو",
             "c": false
            },
            {
             "n": 10,
             "t": "ليونيل شباوي",
             "c": false
            },
            {
             "n": 11,
             "t": "حسين اوزيل",
             "c": false
            },
            {
             "n": 22,
             "t": "محمد كاكا",
             "c": false
            },
            {
             "n": 77,
             "t": "مقتدى بوفون",
             "c": false
            }
           ]
          }
          EOF_FILE
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "add data.json"
          git push || true
